[supervisord]
nodaemon=true
user=root

[program:server_tts]
command=python3 server_tts_audio_control.py
directory=/home/ict/server_tts
autostart=true
autorestart=true
stderr_logfile=/var/log/server_tts.err.log
stdout_logfile=/var/log/server_tts.out.log

[program:face_voice_main]
command=python3 main_server.py
directory=/home/ict/face_voice
autostart=true
autorestart=true
stderr_logfile=/var/log/face_voice_main.err.log
stdout_logfile=/var/log/face_voice_main.out.log

[program:face_voice_video]
command=python3 face_v.py
directory=/home/ict/face_voice
autostart=true
autorestart=true
stderr_logfile=/var/log/face_voice_video.err.log
stdout_logfile=/var/log/face_voice_video.out.log

[program:redcse_web]
command=python3 web.py
directory=/home/admin/Redcse
autostart=true
autorestart=true
stderr_logfile=/var/log/redcse_web.err.log
stdout_logfile=/var/log/redcse_web.out.log

[program:robot_main]
command=python3 main.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/robot_main.err.log
stdout_logfile=/var/log/robot_main.out.log 